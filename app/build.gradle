plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nukhba.branches.employee.demo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nukhba.branches.employee.demo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0-demo'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('NUKHBA_KEYSTORE'))
            storePassword System.getenv('NUKHBA_STORE_PASSWORD')
            keyAlias System.getenv('NUKHBA_KEY_ALIAS')
            keyPassword System.getenv('NUKHBA_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
