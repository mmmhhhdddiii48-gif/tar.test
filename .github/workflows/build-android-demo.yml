name: Build premium Android demo v2

on:
  push:
    branches: [ fix-professional-webview ]
  workflow_dispatch:

permissions:
  contents: read

env:
  NUKHBA_STORE_PASSWORD: NukhbaPremiumDemo72Hours2026
  NUKHBA_KEY_PASSWORD: NukhbaPremiumDemo72Hours2026
  NUKHBA_KEY_ALIAS: nukhba_premium_demo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate release key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/nukhba-premium-demo.jks" -storepass "$NUKHBA_STORE_PASSWORD" -alias "$NUKHBA_KEY_ALIAS" -keypass "$NUKHBA_KEY_PASSWORD" -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Nukhba ERP Premium Demo, OU=Nukhba, O=Nukhba ERP, L=Najaf, C=IQ"
          echo "NUKHBA_KEYSTORE=$RUNNER_TEMP/nukhba-premium-demo.jks" >> "$GITHUB_ENV"

      - name: Build minified signed release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Verify and rename APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          cp "$APK" Nukhba_Employee_Premium_Demo_3_Days_Android_v2.apk
          sha256sum Nukhba_Employee_Premium_Demo_3_Days_Android_v2.apk > Nukhba_Employee_Premium_Demo_3_Days_Android_v2.sha256.txt

      - name: Upload premium APK
        uses: actions/upload-artifact@v4
        with:
          name: Nukhba-Employee-Premium-Demo-v2
          path: |
            Nukhba_Employee_Premium_Demo_3_Days_Android_v2.apk
            Nukhba_Employee_Premium_Demo_3_Days_Android_v2.sha256.txt
          retention-days: 1
          if-no-files-found: error
